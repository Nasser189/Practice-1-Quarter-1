<!DOCTYPE html>
<html lang="en">

<head>
    <title>Top 3 Spotify Artists / Playlists</title>
<style>
        body {
            background-color: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #d4af37;
            font-family: Georgia, serif;
            font-size: 40px;
            text-transform: uppercase;
        }
        ol {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 0;
            list-style-position: inside;
        }

        li {
            margin: 15px;
            color: white;
            text-align: center;
        }

        img {
            width: 200px;
            height: auto;
            border: 4px solid #d4af37;
            border-radius: 10px;
        }
    </style>

</head>

<body>

    <h1>Michael Jackson</h1>
    <img src="King_of_Pop.webp" alt="Michael Jackson">

    <h1>Top 3 Songs</h1>

    <ol>
        <li>
            Billie Jean
            <br>
            <img src="billie jean.jpg" alt="Billie Jean">
        </li>

        <li>
            Beat It
            <br>
            <img src="beat it.jpeg" alt="Beat It">
        </li>

        <li>
            Thriller
            <br>
            <img src="thriller.jpg" alt="Thriller">
        </li>
    </ol>
</body>
</html>
